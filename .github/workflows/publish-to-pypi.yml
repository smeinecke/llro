name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python environment
        run: uv sync

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(uv run --no-sync python -c 'import importlib.metadata; print(importlib.metadata.version("llro"))')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: List dist files
        run: ls -lh dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish on the upstream repo, not forks
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'smeinecke/llro'
    environment:
      name: pypi
      url: https://pypi.org/p/llro
    permissions:
      id-token: write # For OIDC trusted publishing
      contents: read

    # NOTE: Trusted publishing must be configured on pypi.org:
    # 1. Go to https://pypi.org/manage/project/llro/settings/publishing/
    # 2. Add a new "pending publisher" with:
    #    - Owner: smeinecke
    #    - Repository: llro
    #    - Workflow: release.yml
    #    - Environment: pypi

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password/token needed - uses OIDC trusted publishing

  create-github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
