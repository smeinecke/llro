name: Code Checks

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Primes
        id: cache-primes
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python environment
        run: uv sync

      - name: Build wheel
        run: uv build

      - name: Run Ruff (PEP 8 Formatting)
        run: uv run make format

      - name: Run Ruff (Linting)
        run: uv run make check

      - name: Run vulture (Dead Code)
        run: uv run make vulture

      - name: Run xenon (Cyclomatic Complexity)
        run: uv run make xenon

      - name: Run bandit (Security)
        run: uv run make bandit

      - name: Run pyright (Type Checking)
        run: uv run make pyright

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python environment
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run pytest (Unit Tests)
        run: |
          # --no-sync: the sync step above already built the venv for the
          # matrix python. A bare `uv run` would re-resolve against
          # .python-version, switching interpreter.
          uv run --no-sync pytest tests -v -m "not integration" --cov=llro --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage.xml

  integration:
    name: Integration Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: [validate, test]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-cache-

      - name: Set up Python environment
        run: uv sync

      - name: Run Integration Tests
        run: uv run --no-sync pytest tests/test_integration_compose.py -v -m integration --timeout=300 --no-cov
